<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NASA Space Explorer</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1>NASA Space Explorer</h1>
    </div>
    <p class="tagline">Discover the universe with NASA's Astronomy Picture of the Day</p>
  </header>

  <main class="container">
    <section class="controls-card">
      <h2>Choose a date range</h2>
      <form id="rangeForm" class="controls" autocomplete="off">
        <label>Start date<input type="date" id="startDate" required/></label>
        <label>End date<input type="date" id="endDate" required/></label>
        <button id="fetchBtn" type="submit" class="btn">Get Space Images</button>
      </form>
    </section>

    <section id="factSection" class="fact-card" aria-live="polite">
      <h2>Did You Know?</h2>
      <p id="randomFact">Loading a random space fact…</p>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="gallery" class="gallery" aria-label="Astronomy gallery"></section>
  </main>

  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog">
      <button class="modal__close" data-close-modal aria-label="Close modal">×</button>
      <div class="modal__media" id="modalMedia"></div>
      <div class="modal__body">
        <h3 id="modalTitle"></h3>
        <p class="modal__date" id="modalDate"></p>
        <p id="modalExplanation"></p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Built for WD Project 7 · NASA branding · APOD mirror feed compatible</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
